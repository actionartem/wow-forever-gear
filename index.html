<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <meta name="description" content="Экипировка для первых рейдов WoW Forever. Варианты по слотам, характеристики и источники добычи для восьми классов.">
  <title>Экипировка · WoW Forever</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="shell nav"><a class="brand" href="#feral-druid">✦ Forever</a><span class="edition">ЭКИПИРОВКА ДЛЯ ПЕРВЫХ РЕЙДОВ</span></div></header>
  <main>
    <section class="hero"><div class="shell hero-content">
      <p class="eyebrow" id="role">WORLD OF WARCRAFT · УРОВЕНЬ 60</p>
      <h1>Экипировка<br><span id="spec-title">ферала-кота</span></h1>
      <p class="hero-description">Характеристики, боссы, рецепты<br>и маршруты добычи.</p>
    </div></section>
    <section class="shell equipment" aria-label="Подбор экипировки">
      <nav id="classes" class="classes" aria-label="Класс"></nav>
      <nav id="specs" class="specs" aria-label="Специализация"></nav>
      <div class="section-title"><h2 id="gear-heading">Экипировка по слотам</h2><span id="count" class="count" aria-live="polite"></span></div>
      <div id="status" role="status">Загрузка экипировки…</div>
      <div id="slots" class="slots" aria-labelledby="gear-heading"></div>
      <aside class="scope" id="scope"></aside>
      <noscript>Список экипировки недоступен без JavaScript.</noscript>
    </section>
  </main>
  <dialog id="item-dialog" aria-labelledby="dialog-title"><button type="button" id="close-dialog" class="close" aria-label="Закрыть">×</button><div id="dialog-content"></div></dialog>
  <div id="item-tooltip" role="tooltip" hidden></div>
  <footer class="shell footer">World of Warcraft · Forever <span>13 ноября 2026</span></footer>
</body>
</html>
